# Runs the same checks as `make check` on every push and pull request, and
# the Go and frontend tests on Windows.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # The oldest Ubuntu Kisetsu supports, so nothing newer is assumed.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK 3 and WebKitGTK 4.1
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Check
        run: make check

  windows:
    runs-on: windows-latest
    # Until the Windows port is complete (0.3.0, step 2), failures here are
    # reported but do not fail the run.
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # The Go code embeds frontend/dist; the tests do not need the real one.
      - name: Placeholder frontend build
        run: mkdir -p frontend/dist && touch frontend/dist/.placeholder

      - name: Go tests
        run: go test ./...

      - name: Frontend tests
        run: npx tsc --noEmit && npm test
        working-directory: frontend
